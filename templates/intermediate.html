<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Redirecionando...</title>
</head>

<body>
  {{template "tracking" .}}
  <script>
    const target = "{{.Target}}";
    function getCookie(name) {
      const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return v ? v.pop() : '';
    }
    const consented = window.urlInsightConsent && window.urlInsightConsent() === 'granted';
    const payload = {
      short_id: location.pathname.split('/').pop(),
      // Cookies de terceiros só são enviados com consentimento prévio (dado na página inicial).
      ga: consented ? getCookie('_ga') : '',
      fbp: consented ? getCookie('_fbp') : '',
      ua: navigator.userAgent,
      origin: document.referrer
    };
    fetch('/collect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => location.href = j.redirect_to)
      .catch(() => { location.href = target; });
  </script>
</body>

</html>
