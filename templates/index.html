<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>URL Insight - Redirecionamento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin-top: 80px; }
    .btn-lg { font-size: 1.2em; padding: 15px 40px; }
    .analytics-btn { margin-top: 30px; }
  </style>
</head>

<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 text-center">
        <h1 class="mt-5 mb-4">Escolha um destino</h1>
        <div class="d-grid gap-3 col-6 mx-auto mb-4">
          <button class="btn btn-primary btn-lg" onclick="window.location.href='/r/gildemberg'">Gildemberg</button>
          <button class="btn btn-success btn-lg" onclick="window.location.href='/r/andre'">André</button>
        </div>
        <div class="d-grid gap-3 col-6 mx-auto analytics-btn">
          <button class="btn btn-outline-primary btn-lg" onclick="window.location.href='/metrics?short_id=gildemberg'">Analytics Gildemberg</button>
          <button class="btn btn-outline-success btn-lg" onclick="window.location.href='/metrics?short_id=andre'">Analytics André</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {{template "tracking" .}}
</body>

</html>
